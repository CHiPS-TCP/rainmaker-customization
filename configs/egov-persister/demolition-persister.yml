serviceMaps:
  serviceName: demolition-services
  version: 1.0.0
  mappings:
    - version: 1.0
      description: Create Demolition entry
      fromTopic: save-demolition-application
      isTransaction: true
      queryMaps:
        - query: >
            INSERT INTO eg_demolition (
              id, applicationno, tenantid, status, createdby,
              lastmodifiedby, createdtime, lastmodifiedtime, demolitionno, applicationtype, demolitiontype,
              accountid, applicationstatus, approvalno, inspectiondate
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Demolition
          jsonMaps:
            - jsonPath: $.Demolition.id
            - jsonPath: $.Demolition.applicationNo
            - jsonPath: $.Demolition.tenantId
            - jsonPath: $.Demolition.status
            - jsonPath: $.Demolition.auditDetails.createdBy
            - jsonPath: $.Demolition.auditDetails.lastModifiedBy
            - jsonPath: $.Demolition.auditDetails.createdTime
            - jsonPath: $.Demolition.auditDetails.lastModifiedTime
            - jsonPath: $.Demolition.demolitionNo
            - jsonPath: $.Demolition.applicationType
            - jsonPath: $.Demolition.demolitionType
            - jsonPath: $.Demolition.accountId
            - jsonPath: $.Demolition.applicationStatus
            - jsonPath: $.Demolition.approvalNo
            - jsonPath: $.Demolition.inspectionDate
              type: LONG

        - query: >
            INSERT INTO eg_demolition_auditdetails (
              id, applicationno, tenantid, status, createdby,
              lastmodifiedby, createdtime, lastmodifiedtime, demolitionno, applicationtype, demolitiontype,
              accountid, applicationstatus, approvalno, inspectiondate
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Demolition
          jsonMaps:
            - jsonPath: $.Demolition.id
            - jsonPath: $.Demolition.applicationNo
            - jsonPath: $.Demolition.tenantId
            - jsonPath: $.Demolition.status
            - jsonPath: $.Demolition.auditDetails.createdBy
            - jsonPath: $.Demolition.auditDetails.lastModifiedBy
            - jsonPath: $.Demolition.auditDetails.createdTime
            - jsonPath: $.Demolition.auditDetails.lastModifiedTime
            - jsonPath: $.Demolition.demolitionNo
            - jsonPath: $.Demolition.applicationType
            - jsonPath: $.Demolition.demolitionType
            - jsonPath: $.Demolition.accountId
            - jsonPath: $.Demolition.applicationStatus
            - jsonPath: $.Demolition.approvalNo
            - jsonPath: $.Demolition.inspectionDate
              type: LONG

        - query: >
            INSERT INTO eg_demolition_document (
              uuid, documenttype, documentattachment, documentuid, demolitionid, doc_order, status, createdby,
              lastmodifiedby, createdtime, lastmodifiedtime
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Demolition.documents.*
          jsonMaps:
            - jsonPath: $.Demolition.documents.*.uuid
            - jsonPath: $.Demolition.documents.*.documentType
            - jsonPath: $.Demolition.documents.*.documentAttachment
            - jsonPath: $.Demolition.documents.*.documentUid
            - jsonPath: $.Demolition.id
            - jsonPath: $.Demolition.documents.*.order
            - jsonPath: $.Demolition.documents.*.status
            - jsonPath: $.Demolition.documents.*.auditDetails.createdBy
            - jsonPath: $.Demolition.documents.*.auditDetails.lastModifiedBy
            - jsonPath: $.Demolition.documents.*.auditDetails.createdTime
            - jsonPath: $.Demolition.documents.*.auditDetails.lastModifiedTime

        - query: >
            INSERT INTO eg_demolition_details (
              id, demolitionid, additionaldetails, createdby, lastmodifiedby, createdtime, lastmodifiedtime, tenantid
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Demolition.demolitionDetails
          jsonMaps:
            - jsonPath: $.Demolition.demolitionDetails.id
            - jsonPath: $.Demolition.id
            - jsonPath: $.Demolition.demolitionDetails.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.Demolition.demolitionDetails.auditDetails.createdBy
            - jsonPath: $.Demolition.demolitionDetails.auditDetails.lastModifiedBy
            - jsonPath: $.Demolition.demolitionDetails.auditDetails.createdTime
            - jsonPath: $.Demolition.demolitionDetails.auditDetails.lastModifiedTime
            - jsonPath: $.Demolition.demolitionDetails.tenantId

        - query: >
            INSERT INTO eg_demolition_owner (
              id, tenantid, demolitionid, status, isprimaryowner,
              ownertype, ownershippercentage, institutionid, relationship,
              createdby, createdtime, lastmodifiedby, lastmodifiedtime, additionaldetails, uuid
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
            ON CONFLICT (uuid, demolitionid) DO UPDATE SET
              tenantid = EXCLUDED.tenantid,
              status = EXCLUDED.status,
              isprimaryowner = EXCLUDED.isprimaryowner,
              ownertype = EXCLUDED.ownertype,
              ownershippercentage = EXCLUDED.ownershippercentage,
