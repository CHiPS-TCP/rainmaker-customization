      isTransaction: true
      queryMaps:
        - query: >
            UPDATE eg_amalgamation_document_check_list
            SET action = ?, remarks = ?, lastmodifiedby = ?, lastmodifiedtime = ?
            WHERE id = ? AND tenantid = ?;
          basePath: checkList.*
          jsonMaps:
