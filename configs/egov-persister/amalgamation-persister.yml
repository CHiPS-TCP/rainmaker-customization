            - jsonPath: $.Amalgamation.id
            - jsonPath: $.Amalgamation.documents.*.order
            - jsonPath: $.Amalgamation.documents.*.auditDetails.createdBy
            - jsonPath: $.Amalgamation.documents.*.auditDetails.lastModifiedBy
            - jsonPath: $.Amalgamation.documents.*.auditDetails.createdTime
            - jsonPath: $.Amalgamation.documents.*.auditDetails.lastModifiedTime

    - version: 1.0
      description: Save Amalgamation Document Check List
      fromTopic: save-amalgamation-document-checklist
      isTransaction: true
      queryMaps:
        - query: >
            INSERT INTO eg_amalgamation_document_check_list (
              id, documentuid, applicationno, tenantid, action, remarks,
              createdby, lastmodifiedby, createdtime, lastmodifiedtime
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: checkList.*
          jsonMaps:
            - jsonPath: $.checkList.*.id
            - jsonPath: $.checkList.*.documentuid
            - jsonPath: $.checkList.*.applicationNo
            - jsonPath: $.checkList.*.tenantId
            - jsonPath: $.checkList.*.action
            - jsonPath: $.checkList.*.remarks
            - jsonPath: $.checkList.*.createdby
            - jsonPath: $.checkList.*.lastmodifiedby
            - jsonPath: $.checkList.*.createdtime
