serviceMaps:
  serviceName: bpa-services
  mappings:
    - version: 1.0
      description: Persists buildingplan details in EG_BPA_BuildingPlan table
      fromTopic: save-bpa-buildingplan
      isTransaction: true
      queryMaps:
        - query: INSERT INTO eg_bpa_buildingplan(id, applicationNo, landId, accountId, edcrNumber, tenantId, status, approvalDate, businessService, additionalDetails, createdBy, lastmodifiedBy, createdTime, lastmodifiedTime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: BPA
          jsonMaps:
            - jsonPath: $.BPA.id
            - jsonPath: $.BPA.applicationNo
            - jsonPath: $.BPA.landId
            - jsonPath: $.BPA.accountId
            - jsonPath: $.BPA.edcrNumber
            - jsonPath: $.BPA.tenantId
            - jsonPath: $.BPA.status
            - jsonPath: $.BPA.approvalDate
            - jsonPath: $.BPA.businessService
            - jsonPath: $.BPA.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.createdBy
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.createdTime
            - jsonPath: $.BPA.auditDetails.lastModifiedTime

        - query: INSERT INTO eg_bpa_document(id, documenttype, fileStoreId, buildingplanid, documentuid, additionalDetails, createdby, lastmodifiedby, createdtime, lastmodifiedtime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: BPA.documents.*
          jsonMaps:
            - jsonPath: $.BPA.documents.*.id
            - jsonPath: $.BPA.documents.*.documentType
            - jsonPath: $.BPA.documents.*.fileStoreId
            - jsonPath: $.BPA.id
            - jsonPath: $.BPA.documents.*.documentUid
            - jsonPath: $.BPA.documents.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.createdBy
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.createdTime
            - jsonPath: $.BPA.auditDetails.lastModifiedTime

        - query: INSERT INTO eg_bpa_auditdetails SELECT * FROM eg_bpa_buildingplan WHERE id = ?;
          basePath: BPA
          jsonMaps:
            - jsonPath: $.BPA.id

    - version: 1.0
      description: update buildingplan details in EG_BPA_BuildingPlan table
      fromTopic: update-bpa-buildingplan
      isTransaction: true
      queryMaps:
        - query: UPDATE eg_bpa_buildingplan SET applicationno=?, approvalNo=?, applicationDate=?, status=?, additionaldetails=?, lastmodifiedby=?, lastmodifiedtime=?, approvalDate=?, landId=?, edcrNumber=? WHERE id=?;
          basePath: BPA
          jsonMaps:
            - jsonPath: $.BPA.applicationNo
            - jsonPath: $.BPA.approvalNo
            - jsonPath: $.BPA.applicationDate
            - jsonPath: $.BPA.status
            - jsonPath: $.BPA.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.lastModifiedTime
            - jsonPath: $.BPA.approvalDate
            - jsonPath: $.BPA.landId
            - jsonPath: $.BPA.edcrNumber
            - jsonPath: $.BPA.id

        - query: INSERT INTO eg_bpa_auditdetails SELECT * FROM eg_bpa_buildingplan WHERE id = ?;
          basePath: BPA
          jsonMaps:
            - jsonPath: $.BPA.id

        - query: INSERT INTO eg_bpa_document(id, documenttype, fileStoreId, buildingplanid, documentuid, additionalDetails, createdby, lastmodifiedby, createdtime, lastmodifiedtime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET documenttype = ?, fileStoreId = ?, additionalDetails = ?, lastmodifiedby = ?, lastmodifiedtime = ?;
          basePath: BPA.documents.*
          jsonMaps:
            - jsonPath: $.BPA.documents.*.id
            - jsonPath: $.BPA.documents.*.documentType
            - jsonPath: $.BPA.documents.*.fileStoreId
            - jsonPath: $.BPA.id
            - jsonPath: $.BPA.documents.*.documentUid
            - jsonPath: $.BPA.documents.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.createdBy
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.createdTime
            - jsonPath: $.BPA.auditDetails.lastModifiedTime
            - jsonPath: $.BPA.documents.*.documentType
            - jsonPath: $.BPA.documents.*.fileStoreId
            - jsonPath: $.BPA.documents.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.lastModifiedTime

    - version: 1.0
      description: update buildingplan details in EG_BPA_BuildingPlan table
      fromTopic: update-bpa-workflow
      isTransaction: true
      queryMaps:
        - query: INSERT INTO eg_bpa_document(id, documentType, fileStoreId, buildingplanid, documentUid, additionalDetails, createdby, lastmodifiedby, createdtime, lastmodifiedtime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET documenttype = ?, fileStoreId = ?, additionalDetails = ?, lastmodifiedby = ?, lastmodifiedtime = ?;
          basePath: BPA.documents.*
          jsonMaps:
            - jsonPath: $.BPA.documents.*.id
            - jsonPath: $.BPA.documents.*.documentType
            - jsonPath: $.BPA.documents.*.fileStoreId
            - jsonPath: $.BPA.id
            - jsonPath: $.BPA.documents.*.documentUid
            - jsonPath: $.BPA.documents.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.createdBy
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.createdTime
            - jsonPath: $.BPA.auditDetails.lastModifiedTime
            - jsonPath: $.BPA.documents.*.documentType
            - jsonPath: $.BPA.documents.*.fileStoreId
            - jsonPath: $.BPA.documents.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.lastModifiedTime

        - query: INSERT INTO eg_bpa_auditdetails SELECT * FROM eg_bpa_buildingplan WHERE id = ?;
          basePath: BPA
          jsonMaps:
            - jsonPath: $.BPA.id

        - query: UPDATE eg_bpa_buildingplan SET applicationno=?, approvalNo=?, applicationDate=?, status=?, additionaldetails=?, lastmodifiedby=?, lastmodifiedtime=?, approvalDate=?, landId=? WHERE id=?;
          basePath: BPA
          jsonMaps:
            - jsonPath: $.BPA.applicationNo
            - jsonPath: $.BPA.approvalNo
            - jsonPath: $.BPA.applicationDate
            - jsonPath: $.BPA.status
            - jsonPath: $.BPA.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.lastModifiedTime
            - jsonPath: $.BPA.approvalDate
            - jsonPath: $.BPA.landId
            - jsonPath: $.BPA.id

    - version: 1.0
      description: Updates bpa status for auto escalate
      fromTopic: bpa-auto-escalation
      isTransaction: true
      queryMaps:
        - query: INSERT INTO eg_bpa_auditdetails SELECT * FROM eg_bpa_buildingplan WHERE id = ?;
          basePath: BPA
          jsonMaps:
            - jsonPath: $.BPA.id

        - query: UPDATE eg_bpa_buildingplan SET status=?, additionaldetails=?, lastmodifiedby=?, lastmodifiedtime=? WHERE applicationno=?;
          basePath: BPA
          jsonMaps:
            - jsonPath: $.BPA.status
            - jsonPath: $.BPA.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.BPA.auditDetails.lastModifiedBy
            - jsonPath: $.BPA.auditDetails.lastModifiedTime
            - jsonPath: $.BPA.applicationno

    - version: 1.0
      description: Save bpa Document Check List
      fromTopic: save-bpa-document-checklist
      isTransaction: true
      queryMaps:
        - query: INSERT INTO public.eg_bpa_document_check_list(id, documentuid, applicationno, tenantId, action, remarks, createdby, lastmodifiedby, createdtime, lastmodifiedtime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: checkList.*
          jsonMaps:
            - jsonPath: $.checkList.*.id
            - jsonPath: $.checkList.*.documentuid
            - jsonPath: $.checkList.*.applicationNo
            - jsonPath: $.checkList.*.tenantId
            - jsonPath: $.checkList.*.action
            - jsonPath: $.checkList.*.remarks
            - jsonPath: $.checkList.*.createdby
            - jsonPath: $.checkList.*.lastmodifiedby
            - jsonPath: $.checkList.*.createdtime
            - jsonPath: $.checkList.*.lastmodifiedtime

    - version: 1.0
      description: Update bpa Document Check List
      fromTopic: update-bpa-document-checklist
      isTransaction: true
      queryMaps:
        - query: UPDATE public.eg_bpa_document_check_list SET action = ?, remarks = ?, lastmodifiedby = ?, lastmodifiedtime = ? WHERE applicationno = ? AND tenantId = ?;
          basePath: checkList.*
          jsonMaps:
            - jsonPath: $.checkList.*.action
            - jsonPath: $.checkList.*.remarks
            - jsonPath: $.checkList.*.lastmodifiedby
            - jsonPath: $.checkList.*.lastmodifiedtime
            - jsonPath: $.checkList.*.applicationNo
            - jsonPath: $.checkList.*.tenantId

    - version: 1.0
      description: Persists labour cess details in eg_labour_cess_transaction table
      fromTopic: save-bpa-labourcess
      isTransaction: true
      queryMaps:
        - query: INSERT INTO eg_labour_cess_transaction (txn_id, tenant_id, application_no, labour_cess_amount, gateway_txn_id, txn_date, txn_status, receipt_no, txn_status_msg, labour_reference_id, module, created_by, created_time, last_modified_by, last_modified_time, additional_details, request_body, response_body) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: LabourCessTransaction
          jsonMaps:
            - jsonPath: $.LabourCessTransaction.txnId
            - jsonPath: $.LabourCessTransaction.tenantId
            - jsonPath: $.LabourCessTransaction.applicationNo
            - jsonPath: $.LabourCessTransaction.labourCessAmount
            - jsonPath: $.LabourCessTransaction.gatewayTxnId
            - jsonPath: $.LabourCessTransaction.txnDate
            - jsonPath: $.LabourCessTransaction.txnStatus
            - jsonPath: $.LabourCessTransaction.receiptNo
            - jsonPath: $.LabourCessTransaction.txnStatusMsg
            - jsonPath: $.LabourCessTransaction.labourReferenceId
            - jsonPath: $.LabourCessTransaction.module
            - jsonPath: $.LabourCessTransaction.createdBy
            - jsonPath: $.LabourCessTransaction.createdTime
            - jsonPath: $.LabourCessTransaction.lastModifiedBy
            - jsonPath: $.LabourCessTransaction.lastModifiedTime
            - jsonPath: $.LabourCessTransaction.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.LabourCessTransaction.requestBody
              type: JSON
              dbType: JSONB
            - jsonPath: $.LabourCessTransaction.responseBody
              type: JSON
              dbType: JSONB

    - version: 1.0
      description: Updates labour cess details in eg_labour_cess_transaction table
      fromTopic: update-bpa-labourcess
      isTransaction: true
      queryMaps:
        - query: UPDATE eg_labour_cess_transaction SET labour_cess_amount = ? , gateway_txn_id=?, txn_date=?, txn_status=?, receipt_no=?, txn_status_msg=?, labour_reference_id=?, last_modified_by=?, last_modified_time=?, additional_details=?, request_body=?, response_body=? WHERE txn_id=?;
          basePath: LabourCessTransaction
          jsonMaps:
            - jsonPath: $.LabourCessTransaction.labourCessAmount
            - jsonPath: $.LabourCessTransaction.gatewayTxnId
            - jsonPath: $.LabourCessTransaction.txnDate
            - jsonPath: $.LabourCessTransaction.txnStatus
            - jsonPath: $.LabourCessTransaction.receiptNo
            - jsonPath: $.LabourCessTransaction.txnStatusMsg
            - jsonPath: $.LabourCessTransaction.labourReferenceId
            - jsonPath: $.LabourCessTransaction.lastModifiedBy
            - jsonPath: $.LabourCessTransaction.lastModifiedTime
            - jsonPath: $.LabourCessTransaction.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.LabourCessTransaction.requestBody
              type: JSON
              dbType: JSONB
            - jsonPath: $.LabourCessTransaction.responseBody
              type: JSON
              dbType: JSONB
            - jsonPath: $.LabourCessTransaction.txnId