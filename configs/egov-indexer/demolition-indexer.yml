ServiceMaps:
  serviceName: egov-demolition-services
  version: 1.0.0
  mappings:

    # ===============================
    # SAVE DEMOLITION APPLICATION
    # ===============================
    - topic: save-demolition-application
      configKey: INDEX
      indexes:
        - name: demolition-application-index
          type: general
          id: $.Demolition.id, $.Demolition.tenantId
          isBulk: false
          timeStampField: $.Demolition.auditDetails.createdTime
          jsonPath: $
          customJsonMapping:
            indexMapping:
              Data:
                id: id
                tenantId: tenantId
                applicationNo: applicationNo
                approvalNo: approvalNo
                demolitionNo: demolitionNo
                demolitionType: demolitionType
                applicationType: applicationType
                status: status
                applicationStatus: applicationStatus
                inspectionDate: inspectionDate
                accountId: accountId
                workflowAction: workflowAction
                createdBy: createdBy
                lastModifiedBy: lastModifiedBy
                createdTime: createdTime
                lastModifiedTime: lastModifiedTime
                documents: documents
                owners: owners
                demolitionDetails: demolitionDetails
                siteDetails: {}
                additionalDetails: {}
            fieldMapping:
              - inJsonPath: $.Demolition.id
                outJsonPath: $.Data.id
              - inJsonPath: $.Demolition.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.Demolition.applicationNo
