ServiceMaps:
  serviceName: egov-layout-services
  version: 1.0.0
  mappings:

    - topic: save-layout-application
      configKey: INDEX
      indexes:
        - name: layout-application-index
          type: general
          id: $.Layout.id, $.Layout.tenantId
          isBulk: false
          timeStampField: $.Layout.auditDetails.createdTime
          jsonPath: $
          customJsonMapping:
            indexMapping:
              Data:
                id: id
                tenantId: tenantId
                applicationNo: applicationNo
                applicationType: applicationType
                layoutNo: layoutNo
                layoutType: layoutType
                status: status
                applicationStatus: applicationStatus
                accountId: accountId
                workflowAction: workflowAction
                createdBy: createdBy
                lastModifiedBy: lastModifiedBy
                createdTime: createdTime
                lastModifiedTime: lastModifiedTime
                documents: documents
                owners: owners
                layoutDetails: layoutDetails
                siteDetails: {}
                additionalDetails: {}

            fieldMapping:
              - inJsonPath: $.Layout.id
                outJsonPath: $.Data.id

              - inJsonPath: $.Layout.tenantId
                outJsonPath: $.Data.tenantId

              - inJsonPath: $.Layout.applicationNo
                outJsonPath: $.Data.applicationNo

              - inJsonPath: $.Layout.applicationType
                outJsonPath: $.Data.applicationType

              - inJsonPath: $.Layout.layoutNo
                outJsonPath: $.Data.layoutNo

              - inJsonPath: $.Layout.layoutType
                outJsonPath: $.Data.layoutType

              - inJsonPath: $.Layout.status
                outJsonPath: $.Data.status

              - inJsonPath: $.Layout.applicationStatus
                outJsonPath: $.Data.applicationStatus

              - inJsonPath: $.Layout.accountId
                outJsonPath: $.Data.accountId

              - inJsonPath: $.Layout.workflow.action
                outJsonPath: $.Data.workflowAction

              - inJsonPath: $.Layout.auditDetails.createdBy
                outJsonPath: $.Data.createdBy

              - inJsonPath: $.Layout.auditDetails.lastModifiedBy
                outJsonPath: $.Data.lastModifiedBy

              - inJsonPath: $.Layout.auditDetails.createdTime
                outJsonPath: $.Data.createdTime

              - inJsonPath: $.Layout.auditDetails.lastModifiedTime
                outJsonPath: $.Data.lastModifiedTime

              - inJsonPath: $.Layout.documents
                outJsonPath: $.Data.documents

              - inJsonPath: $.Layout.owners
                outJsonPath: $.Data.owners

              - inJsonPath: $.Layout.layoutDetails
                outJsonPath: $.Data.layoutDetails

              - inJsonPath: $.Layout.layoutDetails.additionalDetails.siteDetails
                outJsonPath: $.Data.siteDetails

              - inJsonPath: $.Layout.layoutDetails.additionalDetails
                outJsonPath: $.Data.additionalDetails


    - topic: update-layout-application
      configKey: INDEX
      indexes:
        - name: layout-application-index
          type: general
          id: $.Layout.id, $.Layout.tenantId
          isBulk: false
          timeStampField: $.Layout.auditDetails.lastModifiedTime
          jsonPath: $
          customJsonMapping:
            indexMapping:
              Data:
                id: id
                tenantId: tenantId
                applicationNo: applicationNo
                applicationType: applicationType
                layoutNo: layoutNo
                layoutType: layoutType
                status: status
                applicationStatus: applicationStatus
                accountId: accountId
                workflowAction: workflowAction
                createdBy: createdBy
                lastModifiedBy: lastModifiedBy
                createdTime: createdTime
                lastModifiedTime: lastModifiedTime
                documents: documents
                owners: owners
                layoutDetails: layoutDetails
                siteDetails: {}
                additionalDetails: {}

            fieldMapping:
              - inJsonPath: $.Layout.id
                outJsonPath: $.Data.id

              - inJsonPath: $.Layout.tenantId
                outJsonPath: $.Data.tenantId

              - inJsonPath: $.Layout.applicationNo
                outJsonPath: $.Data.applicationNo

              - inJsonPath: $.Layout.applicationType
                outJsonPath: $.Data.applicationType

              - inJsonPath: $.Layout.layoutNo
                outJsonPath: $.Data.layoutNo

              - inJsonPath: $.Layout.layoutType
                outJsonPath: $.Data.layoutType

              - inJsonPath: $.Layout.status
                outJsonPath: $.Data.status

              - inJsonPath: $.Layout.applicationStatus
                outJsonPath: $.Data.applicationStatus

              - inJsonPath: $.Layout.accountId
                outJsonPath: $.Data.accountId

              - inJsonPath: $.Layout.workflow.action
                outJsonPath: $.Data.workflowAction

              - inJsonPath: $.Layout.auditDetails.createdBy
                outJsonPath: $.Data.createdBy

              - inJsonPath: $.Layout.auditDetails.lastModifiedBy
                outJsonPath: $.Data.lastModifiedBy

              - inJsonPath: $.Layout.auditDetails.createdTime
                outJsonPath: $.Data.createdTime

              - inJsonPath: $.Layout.auditDetails.lastModifiedTime
                outJsonPath: $.Data.lastModifiedTime

              - inJsonPath: $.Layout.documents
                outJsonPath: $.Data.documents

              - inJsonPath: $.Layout.owners
                outJsonPath: $.Data.owners

              - inJsonPath: $.Layout.layoutDetails
                outJsonPath: $.Data.layoutDetails

              - inJsonPath: $.Layout.layoutDetails.additionalDetails.siteDetails
                outJsonPath: $.Data.siteDetails

              - inJsonPath: $.Layout.layoutDetails.additionalDetails
                outJsonPath: $.Data.additionalDetails