
ServiceMaps:
  serviceName: egov-amalgamation-services
  version: 1.0.0
  mappings:

    # ===============================
    # SAVE AMALGAMATION APPLICATION
    # ===============================
    - topic: save-amalgamation-application
      configKey: INDEX
      indexes:
        - name: amalgamation-application-index
          type: general
          id: $.Amalgamation.id, $.Amalgamation.tenantId
          isBulk: false
          timeStampField: $.Amalgamation.auditDetails.createdTime
          jsonPath: $
          customJsonMapping:
            indexMapping:
              Data:
                id: id
                tenantId: tenantId
                applicationNo: applicationNo
                approvalNo: approvalNo
                edcrNumber: edcrNumber
                inspectionDate: inspectionDate
                vasikaNumber: vasikaNumber
                vasikaDate: vasikaDate
                applicationType: applicationType
                amalgamationNo: amalgamationNo
                amalgamationType: amalgamationType
                status: status
                applicationStatus: applicationStatus
                accountId: accountId
                workflowAction: workflowAction
                createdBy: createdBy
                lastModifiedBy: lastModifiedBy
                createdTime: createdTime
                lastModifiedTime: lastModifiedTime
                documents: documents
                owners: owners
                amalgamationDetails: amalgamationDetails

            fieldMapping:
              - inJsonPath: $.Amalgamation.id
                outJsonPath: $.Data.id
              - inJsonPath: $.Amalgamation.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.Amalgamation.applicationNo
