ServiceMaps:
  serviceName: bpa-services
  version: 1.0.0
  mappings:

    # ===============================
    # SAVE BPA BUILDING PLAN
    # ===============================
    - topic: save-bpa-buildingplan
      configKey: INDEX
      indexes:
        - name: bpa-buildingplan-index
          type: general
          id: $.BPA.id, $.BPA.tenantId
          isBulk: false
          timeStampField: $.BPA.auditDetails.createdTime
          jsonPath: $
          customJsonMapping:
            indexMapping:
              Data:
                id: id
                tenantId: tenantId
                applicationNo: applicationNo
                approvalNo: approvalNo
                edcrNumber: edcrNumber
                applicationType: applicationType
                riskType: riskType
                businessService: businessService
                landId: landId
                accountId: accountId
                applicationDate: applicationDate
                approvalDate: approvalDate
                status: status
                workflowAction: workflowAction
                createdBy: createdBy
                lastModifiedBy: lastModifiedBy
                createdTime: createdTime
                lastModifiedTime: lastModifiedTime
                documents: documents
                landInfo: {}
                additionalDetails: {}
            fieldMapping:
              - inJsonPath: $.BPA.id
                outJsonPath: $.Data.id
              - inJsonPath: $.BPA.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.BPA.applicationNo
